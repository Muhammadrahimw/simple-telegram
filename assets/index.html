<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>

<body>

    <main>
        <div class="left">
            <div class="head">
                <i id="bars" class="fa-solid fa-bars fa-xl"></i>
                <input id="searchInput" placeholder="Search" type="text">
                <i id="openLockIcon" class="fa-solid fa-unlock fa-lg"></i>
                <i id="closeLockIcon" class="fa-solid fa-lock fa-lg"></i>
                <i id="logOutProfile" class="fa-solid fa-arrow-right-from-bracket fa-lg"></i>
            </div>
            <div class="users">
                <div class="user"></div>
                <div class="user"></div>
                <div class="user"></div>
                <div class="user"></div>
                <div class="user"></div>
                <div class="user"></div>
                <div class="user"></div>
                <div class="user"></div>
            </div>
        </div>
        <div class="right">
            <div class="first_screen">
                <div class="head">
                    <div class="userLogo"></div>
                    <div class="userInfoModalContainer">
                        <form id="userInfoModal">
                            <div>
                                <p>Your info</p>
                                <i id="userInfoModalClose" class="fa-solid fa-xmark fa-lg"></i>
                            </div>
                            <div>
                                <div class="userLogoModalContainer">
                                    <div class="userLogoModal"></div>
                                </div>
                                <p id="userModalName"></p>
                            </div>
                            <hr>
                            <div>
                                <p>Your phone number</p>
                                <p id="userModalPhoneNumber"></p>
                            </div>
                            <div>
                                <p>Your email address</p>
                                <p id="userModalEmailAddress"></p>
                            </div>
                            <div>
                                <p>Your password</p>
                                <p id="userModalPassword"></p>
                            </div>
                        </form>
                        <!-- ma'lumotlarni tahrirlash uchun modallar -->
                        <!-- <div class="userNewInfoInputContainer" id="userNewNameContainer">
                            <input id="userNewNameInput" placeholder="Enter new name" type="text">
                            <button id="userNewNameAccept">Accept</button>
                        </div>
                        <div class="userNewInfoInputContainer" id="userNewPhoneContainer">
                            <input id="userNewPhoneInput" placeholder="Enter new phone number" type="text">
                            <button id="userNewPhoneAccept">Accept</button>
                        </div>
                        <div class="userNewInfoInputContainer" id="userNewEmailContainer">
                            <input id="userNewEmailInput" placeholder="Enter new email" type="text">
                            <button id="userNewEmailAccept">Accept</button>
                        </div>
                        <div class="userNewInfoInputContainer" id="userNewPasswordContainer">
                            <input id="userNewPasswordInput" placeholder="Enter password" type="text">
                            <button id="userNewPasswordAccept">Accept</button>
                        </div> -->
                    </div>
                </div>
                <div id="first_message" class="messages scrollable"></div>
                <div class="sending">
                    <input id="hidden_input_1" type="file">
                    <i id="user_1_img" class="fa-solid fa-paperclip fa-lg"></i>
                    <input id="user_1_message" placeholder="Write a message..." type="text">
                    <i class="fa-solid fa-note-sticky fa-lg"></i>
                    <i id="send_icon_1" class="fa-solid fa-paper-plane fa-lg"></i>
                </div>
            </div>
            <div class="second_screen">
                <div class="head"></div>
                <div id="second_message" class="messages scrollable"></div>
                <div class="sending">
                    <input id="hidden_input_2" type="file">
                    <i id="user_2_img" class="fa-solid fa-paperclip fa-lg"></i>
                    <input id="user_2_message" placeholder="Write a message..." type="text">
                    <i class="fa-solid fa-note-sticky fa-lg"></i>
                    <i id="send_icon_2" class="fa-solid fa-paper-plane fa-lg"></i>
                </div>
            </div>
        </div>
    </main>
    <div class="forPassword">
        <form class="passContainer">
            <input id="passNumber" placeholder="Enter phone number" type="text">
            <input id="passEmail" placeholder="Enter email address" type="text">
            <input id="passCode" placeholder="password" type="password">
            <button id="passBtn" type="submit">Log in</button>
            <p id="logEmail">Try with email address</p>
            <p id="logPhone">Try with phone number</p>
            <p id="logOther">Try with other profile</p>
            <p id="logOut" style="font-weight: 400;">Log out if
                you are not registered</p>
        </form>
    </div>

    <div id="modal" class="modal">
        <button id="deleteBtn" class="btn">Delete</button>
        <button id="editBtn" class="btn">Edit</button>
    </div>
    <script src="./main.js"></script>
</body>

</html>
