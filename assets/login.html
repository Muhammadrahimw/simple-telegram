<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>

<body>

    <main class="loginMain">
        <div class="loginContainer">
            <i class="fa-brands fa-telegram fa-2xl" style="color: #74C0FC;"></i>
            <h1>Telegram</h1>
            <p>Please enter your <br> information</p>
            <form id="loginForm">
                <input required id="registerName" placeholder="Your name" type="text">
                <input required id="registerNumber" placeholder="Your phone number" type="text">
                <input required id="registerEmail" placeholder="Your email" type="email">
                <input required id="registerPassword" placeholder="Your password" type="password">
                <button id="registerSubmit" type="submit">Sign up</button>
            </form>
        </div>
    </main>



    <script src="./login.js"></script>
</body>

</html>
